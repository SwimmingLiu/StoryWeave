<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="storyweave-producer" content="storyweave-html"><meta name="storyweave-canvas" content="1280x720"><title>AI 原生知识工作流</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F1EEE7;color:#201C18;font-family:Georgia, 'Noto Serif SC', serif}body{display:grid;place-items:center}.deck{width:100%;height:100%;display:grid;place-items:center}.slide{display:none;position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;overflow:hidden;background:#F1EEE7;border:1px solid #D4CABC}.slide.active,.single .slide{display:block}.copy{position:absolute;z-index:2;left:7.5%;top:12%;width:54%;height:76%;display:flex;flex-direction:column;justify-content:center}.copy h1{margin:0 0 28px;font-family:Georgia, 'Noto Serif SC', serif;font-size:clamp(34px,4.4vw,64px);line-height:1.04;letter-spacing:-.025em}.copy p,.copy li{font-size:clamp(18px,2vw,30px);line-height:1.38;color:#70665C}.copy ol{display:grid;gap:12px;margin:0;padding-left:1.3em}.columns,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.columns p,.metrics>div{margin:0;padding:20px;border:1px solid #D4CABC;background:#FCF9F2;border-radius:0px}.metrics strong,.metrics span{display:block}.metrics strong{font-size:44px;color:#A23B2A}.art{position:absolute;right:5%;top:12%;width:35%;height:76%;border:1px solid #D4CABC;background:#FCF9F2;overflow:hidden;border-radius:0px}.art:before,.art:after,.art i{content:"";position:absolute;border-radius:50%}.art:before{width:68%;aspect-ratio:1;right:-10%;top:8%;border:18px solid #A23B2A;opacity:.8}.art:after{width:54%;aspect-ratio:1;left:-16%;bottom:-8%;background:#285C7A;opacity:.72}.art i:nth-child(1){width:72%;height:3px;left:10%;top:52%;background:#201C18;transform:rotate(-17deg)}.art i:nth-child(2){width:20px;height:20px;left:25%;top:24%;background:#A23B2A}.art i:nth-child(3){width:36px;height:36px;right:18%;bottom:17%;border:8px solid #201C18}.role-cover,.role-closing{background:#201C18;color:#FCF9F2}.role-cover .copy,.role-closing .copy{width:64%}.role-cover .copy p,.role-closing .copy p{color:#FCF9F2;opacity:.78}.role-cover .art,.role-closing .art{background:transparent;border-color:#A23B2A}.counter{position:absolute;z-index:3;right:18px;bottom:14px;padding:5px 8px;background:#201C18;color:#FCF9F2;font:12px system-ui}.nav{position:fixed;z-index:9;top:50%;width:42px;height:42px;border:0;border-radius:50%;background:#201C18;color:#FCF9F2;font-size:24px;cursor:pointer}.nav.prev{left:12px}.nav.next{right:12px}@media print{body{display:block;overflow:visible}.deck{display:block}.slide{display:block;width:100vw;height:56.25vw;page-break-after:always}.nav,.counter{display:none}}</style></head><body><main class="deck"><section class="slide role-cover active" data-storyweave-slide data-slide-id="s01" data-slide-index="0"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>AI 原生知识工作流</h1><p>让上下文持续产生价值</p></div><span class="counter">1 / 6</span></section><section class="slide role-statement" data-storyweave-slide data-slide-id="s02" data-slide-index="1"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>信息很多，上下文却在丢失</h1><p>资料散落</p><p>判断失联</p><p>行动断点</p></div><span class="counter">2 / 6</span></section><section class="slide role-comparison" data-storyweave-slide data-slide-id="s03" data-slide-index="2"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>从文件堆积，转向上下文复用</h1><div class="columns"><p>过去：保存结果</p><p>现在：保存判断过程</p></div></div><span class="counter">3 / 6</span></section><section class="slide role-process" data-storyweave-slide data-slide-id="s04" data-slide-index="3"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>四个动作构成闭环</h1><ol><li>收集现场</li><li>建立关联</li><li>形成判断</li><li>推进行动</li></ol></div><span class="counter">4 / 6</span></section><section class="slide role-data" data-storyweave-slide data-slide-id="s05" data-slide-index="4"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>价值 = 上下文质量 × 复用次数</h1><p>一次整理，多次调用</p></div><span class="counter">5 / 6</span></section><section class="slide role-closing" data-storyweave-slide data-slide-id="s06" data-slide-index="5"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><div class="copy"><h1>先重做一条高频流程</h1><p>把上下文、判断和行动连起来</p></div><span class="counter">6 / 6</span></section></main><button class="nav prev" aria-label="上一页">‹</button><button class="nav next" aria-label="下一页">›</button><script>(()=>{const slides=[...document.querySelectorAll('[data-storyweave-slide]')];let current=0;function show(next){slides[current]?.classList.remove('active');current=(next+slides.length)%slides.length;slides[current]?.classList.add('active')}document.querySelector('.prev').onclick=()=>show(current-1);document.querySelector('.next').onclick=()=>show(current+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1)})})();</script></body></html>
