name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Unspecified Linux shells do not enable pipefail, so tee could otherwise hide a failing test or download.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_EVALUATION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REFERENCE_CACHE: ${{ github.workspace }}/tmp/ci-reference-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r .agents/skills/verify-storyweave/scripts/requirements-ci.txt
          npx playwright install --with-deps chromium
      - name: Check generated packages and gallery
        run: |
          npm run check:packages
          # Actual generated previews are separate from the external reference gallery and must match their provenance.
          npm run check:themes
          node scripts/build-presentation-reference-gallery.mjs --check
      - name: Run complete test suite
        run: |
          mkdir -p tmp/ci
          npm test 2>&1 | tee tmp/ci/tests.log
      - name: Prepare original reference images
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/cache-presentation-references.py --cache "$CI_REFERENCE_CACHE" | tee "tmp/ci/reference-cache-$attempt.json"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          python scripts/cache-presentation-references.py --cache "$CI_REFERENCE_CACHE" --check
      - name: Drive all eight features and verify cleanup
        run: npm run verify:ci -- --run-id "$CI_EVALUATION_RUN_ID" --reference-cache "$CI_REFERENCE_CACHE"
      # Technical fixtures did not capture the actual two-deck visual sample; changed pixels require a reviewed baseline.
      - name: Verify two eight-page HTML visual samples
        run: npm run verify:visual -- check --out "$GITHUB_WORKSPACE/tmp/visual-ci"
      - name: Retain HTML visual comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storyweave-html-visual-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/visual-ci/
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storyweave-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tmp/ci/
            tmp/verification/
            !tmp/verification/**/offline-viewer/**
