<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 智能客服架构 · 主题候选</title>
  <style>
    :root { color-scheme:light; --ink:#12212a; --muted:#60717b; --line:#d9e1e5; --paper:#f4f6f7; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,"Noto Sans SC",sans-serif; }
    header,main { width:min(1440px,calc(100% - 40px)); margin:auto; }
    header { padding:48px 0 24px; }
    h1 { margin:0 0 12px; font-size:clamp(30px,4vw,54px); letter-spacing:-.03em; }
    header p { margin:0; color:var(--muted); font-size:18px; line-height:1.65; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; padding:18px 0 60px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:white; box-shadow:0 10px 30px rgba(25,48,60,.07); }
    img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#e7ecef; }
    .meta { padding:18px 20px 22px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h2 { margin:0; font-size:20px; }
    .badge { padding:5px 9px; border-radius:999px; color:#00677d; background:#e7f8fb; font-size:12px; font-weight:700; }
    .meta p { margin:10px 0 0; color:var(--muted); line-height:1.55; }
    @media(max-width:850px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header>
    <h1>AI 智能客服架构 · 两个候选主题</h1>
    <p>保留杂志叙事和白底青蓝电路两个方向；其他初稿已归档。</p>
  </header>
  <main class="grid">
    <article>
      <img src="variants/storyweave-editorial/slides/s01.png" alt="编辑叙事版本">
      <div class="meta"><div class="row"><h2>编辑叙事</h2><span class="badge">保留</span></div><p>人物叙事和杂志排版有辨识度，适合观点表达。</p></div>
    </article>
    <article>
      <img src="variants/wuming-cyan-circuit/slides/s01.png" alt="wuming 青蓝电路版本">
      <div class="meta"><div class="row"><h2>wuming 青蓝电路</h2><span class="badge">保留</span></div><p>架构关系清楚，适合技术说明和方案沟通。</p></div>
    </article>
  </main>
</body>
</html>
