<!doctype html><html lang="zh-CN" data-architecture="systems" data-visual-system="swiss"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="storyweave-producer" content="storyweave-html"><meta name="storyweave-theme-ref" content="systems/ink-blue-grid"><meta name="storyweave-canvas" content="1280x720"><meta name="storyweave-content-revision" content="1708b64e44e41252474c745c3c583b322b1de6694f706704070da3a40998182a"><title>StoryWeave 内容与表达</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#FAFAF8;font-family:'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;color:#0A0A0A;-webkit-font-smoothing:antialiased}
.stage-viewport{position:relative;width:100vw;height:100vh;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;margin-left:-640px;margin-top:-360px;width:1280px;height:720px;transform-origin:center}
.slide{--paper:#FAFAF8;--ink:#0A0A0A;--brand:#002FA7;--surface:#FFFFFF;--line:#D4D4D2;--fg:var(--ink);--bg:var(--paper);--accent:var(--brand);--quiet:#737373;position:absolute;inset:0;display:none;background:var(--bg);color:var(--fg);overflow:hidden}
.slide.active{display:block}.tone-dark{--bg:var(--ink);--fg:var(--paper);--quiet:#d4d8df;--accent:#bdcaff;--line:#687080;--surface:#252b35}
.tone-accent{--bg:var(--brand);--fg:#fff;--quiet:#f2f3f7;--accent:#fff;--line:#ffffff66;--surface:#ffffff12}
h1,h2,p,figure,blockquote{margin:0}h1{font-family:'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;font-size:var(--title-size,64px);font-weight:var(--title-weight,300);line-height:1.16;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere;line-break:strict}
h2{font-size:28px;line-height:1.25;font-weight:500}p,td,th{font-size:28px;line-height:1.5;font-weight:400}p{color:var(--quiet)}
.title-word,.copy-word{white-space:nowrap}p{text-wrap:pretty}
.slide-head{position:absolute;left:var(--gutter,64px);right:var(--gutter,64px);top:72px}
.slide-head h1{max-width:1100px}.layout-body{position:absolute;left:var(--gutter,64px);right:var(--gutter,64px);top:var(--body-top,256px);bottom:80px}
.counter{position:absolute;left:var(--gutter,64px);right:var(--gutter,64px);bottom:28px;text-align:right;color:var(--quiet);font:500 16px 'SFMono-Regular',Consolas,monospace;letter-spacing:.1em}
.statement-composition{position:absolute;inset:80px var(--gutter,64px) 88px;display:grid;align-items:center}
.statement-copy{min-width:0;max-width:1080px}.statement-copy h1{max-width:1000px}.statement-body{display:grid;gap:14px;margin-top:var(--title-gap,48px);max-width:920px}
.statement-body p{font-size:28px;line-height:1.5}.kicker{font:500 18px 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;letter-spacing:.14em;margin-bottom:32px;color:var(--accent)}
.layout-cover-split .statement-copy{max-width:1000px}.layout-cover-split .statement-body{max-width:760px}.layout-closing-statement .statement-copy{max-width:1060px}
.layout-quote blockquote{border-left:3px solid var(--accent);padding-left:40px}.attribution{margin-top:24px;font-size:18px}
.has-image{grid-template-columns:1fr 1fr;gap:56px}.has-image .statement-copy h1{font-size:min(var(--title-size),64px)}
.asset-figure{min-width:0;align-self:start;display:grid;grid-template-rows:auto auto;gap:12px}.asset-figure img{display:block;width:100%;aspect-ratio:var(--image-ratio,4/3)}
.asset-figure figcaption{font-size:16px;font-weight:500;line-height:1.4;color:var(--quiet)}
.layout-statement-split .statement-copy{display:grid;grid-template-columns:7fr 5fr;gap:80px;align-items:center;max-width:none}
.layout-statement-split h1{max-width:620px}.layout-statement-split .statement-body{margin:0;padding-left:32px;border-left:1px solid var(--line);gap:32px}
.layout-statement-split .kicker{grid-column:1/-1}.image-hero-body{display:grid;grid-template-columns:2.15fr 1fr;gap:48px;align-items:start}
.image-copy{display:grid;gap:24px;padding-top:8px}.image-copy p{font-size:24px;line-height:1.5}
/* Image composition follows the information task and available title/copy capacity, not a shared picture box. */
.slide[data-composition="image-editorial"] .image-hero-body{grid-template-columns:1fr 1.8fr;gap:48px}
.slide[data-composition="image-editorial"] .asset-figure{grid-column:2;grid-row:1}
.slide[data-composition="image-editorial"] .image-copy{grid-column:1;grid-row:1;padding-top:0;gap:32px}
.slide[data-composition="image-editorial"] .image-copy p{font-size:28px}
.slide[data-composition="image-strip"] .image-hero-body{grid-template-columns:1fr;gap:24px}
.slide[data-composition="image-strip"] .image-copy{grid-template-columns:1fr 1fr;gap:64px;padding-top:0}
.comparison-matrix{width:100%;border-collapse:collapse;table-layout:fixed}.comparison-axis{width:20%}
.comparison-matrix thead th{padding:0 24px 24px;text-align:left;font-size:32px;font-weight:500;border-bottom:2px solid var(--accent);color:var(--fg)}
.comparison-matrix thead th:first-child{padding-left:0;border-bottom:1px solid var(--line)}
.comparison-matrix tbody th,.comparison-matrix tbody td{padding:20px 24px;vertical-align:top;border-bottom:1px solid var(--line);font-size:26px;line-height:1.4;text-align:left}
.comparison-matrix tbody th{padding-left:0;font-size:24px;font-weight:500;color:var(--quiet)}
/* The content describes a neutral comparison; coloring only its last column implied a recommendation. */
.comparison-matrix tbody td{color:var(--fg)}
.metrics-body{display:flex;flex-direction:column;gap:32px}.metric-ledger{display:grid;grid-template-columns:repeat(var(--metric-count),minmax(0,1fr));gap:32px;align-items:start}
.metric-entry{min-width:0;padding-top:24px;border-top:1px solid var(--line)}.metric-number{display:flex;gap:10px;align-items:baseline;margin-bottom:24px;white-space:nowrap}
.metric-number [data-storyweave-content="metric-value"]{font-family:'Helvetica Neue','Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;font-weight:300;font-size:var(--metric-size,104px);line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.metric-number [data-storyweave-content="metric-unit"]{font-size:24px;font-weight:500}.metric-entry h2{font-size:26px;font-weight:400}.metric-source{font-size:16px;line-height:1.4;margin-top:24px;font-weight:500}
.metric-notes{display:grid;gap:10px}.metric-note{font-size:24px}
.process-rail{position:relative;display:grid;grid-template-columns:repeat(var(--step-count),minmax(0,1fr));gap:36px;list-style:none;padding:0;margin:0}
.process-rail li{min-width:0;padding-top:8px}.step-index{display:block;font:300 64px 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;line-height:1;margin-bottom:32px;color:var(--accent);letter-spacing:-.04em}
.step-anchor{display:block;width:10px;height:10px;background:var(--accent);margin-bottom:32px}
.process-rail h2{font-size:32px;line-height:1.2;margin-bottom:20px}.process-rail p{font-size:24px;max-width:270px}
.relationship-connections{position:absolute;inset:0;width:100%;height:var(--diagram-height,350px);overflow:visible;color:var(--accent)}
.relationship-connections text{font:24px 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;fill:var(--fg);stroke:var(--bg);stroke-width:6px;paint-order:stroke fill}
.relationship-map{position:relative;width:100%;height:var(--diagram-height,350px)}.relationship-node{position:absolute;width:var(--node-width,220px);min-height:96px;padding:18px 20px;border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--bg);transform:translate(-50%,-50%)}
.relationship-node h2{font-size:28px;line-height:1.22}.relationship-node p{font-size:24px;line-height:1.35;margin-top:12px}
.nav{position:fixed;bottom:18px;width:44px;height:44px;border:1px solid #74809666;border-radius:50%;background:#fff;color:#18212d;font:26px Georgia,serif;cursor:pointer;z-index:20}
.nav.prev{left:18px}.nav.next{right:18px}.nav:focus-visible{outline:3px solid #3e66ff;outline-offset:3px}
/* Magazine layouts use offset text columns and a vertical ledger instead of repeating a card grid. */
html[data-visual-system="magazine"] h1{letter-spacing:-.025em}
html[data-visual-system="magazine"] .tone-dark{--accent:#e3baa6;--quiet:#d9d2c9;--line:#766e65}
html[data-visual-system="magazine"] .layout-cover-split .statement-copy{border-top:1px solid var(--line);padding-top:48px}
html[data-visual-system="magazine"] .layout-cover-split h1{max-width:880px}
html[data-visual-system="magazine"] .layout-statement .statement-copy{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:48px 24px}
html[data-visual-system="magazine"] .layout-statement h1,html[data-visual-system="magazine"] .layout-statement .kicker{grid-column:1/-1}
html[data-visual-system="magazine"] .layout-statement .statement-body{grid-column:6/-1;margin:0;max-width:none;padding-top:24px;border-top:1px solid var(--line)}
html[data-visual-system="magazine"] .layout-closing-statement .statement-body{margin-left:30%;max-width:760px}
html[data-visual-system="magazine"] .comparison-matrix thead th{font-family:'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;font-weight:600}
html[data-visual-system="magazine"] .metric-ledger{grid-template-columns:1fr;gap:0}
html[data-visual-system="magazine"] .metric-entry{display:grid;grid-template-columns:4fr 3fr 4fr;gap:32px;align-items:baseline;padding:18px 0}
html[data-visual-system="magazine"] .metric-number{margin:0}
html[data-visual-system="magazine"] .metric-number [data-storyweave-content="metric-value"]{font-family:Georgia,'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;font-size:76px;font-weight:400}
html[data-visual-system="magazine"] .metric-source{margin:0}
html[data-visual-system="magazine"] .process-rail li{border-top:1px solid var(--line);padding-top:24px}
html[data-visual-system="magazine"] .step-index{font-family:Georgia,serif;font-style:italic}
html[data-visual-system="magazine"] .slide[data-composition="diagram-down"] .relationship-node{min-height:96px;padding:10px 16px;border:0;border-left:3px solid var(--accent);background:var(--surface)}
/* Swiss pages share one 64px axis and reserve heavy color for anchor pages. */
html[data-visual-system="swiss"] .layout-cover-split .statement-copy{max-width:1100px}
html[data-visual-system="swiss"] .layout-cover-split .statement-body{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);max-width:1000px}
html[data-visual-system="swiss"] .layout-statement-split{background:linear-gradient(90deg,var(--bg) 0 60%,var(--surface) 60%)}
html[data-visual-system="swiss"] .layout-statement-split .statement-copy{grid-template-columns:repeat(16,minmax(0,1fr));gap:16px}
html[data-visual-system="swiss"] .layout-statement-split h1{grid-column:1/10}
html[data-visual-system="swiss"] .layout-statement-split .statement-body{grid-column:11/-1}
html[data-visual-system="swiss"] .layout-closing-statement{background:linear-gradient(90deg,var(--brand) 0 58%,var(--paper) 58%)}
html[data-visual-system="swiss"] .layout-closing-statement .statement-copy{display:grid;grid-template-columns:7fr 5fr;gap:96px;align-items:center;max-width:none}
html[data-visual-system="swiss"] .layout-closing-statement h1{color:#fff;max-width:600px;font-size:min(var(--title-size),82px)}
html[data-visual-system="swiss"] .layout-closing-statement .statement-body{margin:0;gap:32px}
html[data-visual-system="swiss"] .layout-closing-statement .counter{color:var(--ink)}
html[data-visual-system="swiss"] .metric-entry:first-child{border-top-color:var(--accent)}
html[data-visual-system="swiss"] .relationship-node{border:0;border-top:1px solid var(--line);padding:16px 12px}
html[data-architecture="campaign"] h1{font-weight:700}html[data-architecture="campaign"] .slide-head{border-left:8px solid var(--accent);padding-left:24px}
html[data-architecture="cinematic"] .slide:after{content:"";position:absolute;inset:18px;border:1px solid var(--line);pointer-events:none}
@media(prefers-reduced-motion:no-preference){.slide.active .slide-head,.slide.active .statement-copy{animation:page-enter .35s ease-out both}@keyframes page-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style></head><body><div class="stage-viewport"><main class="stage" data-reading-mode="speaker-led"><section class="slide layout-closing-statement tone-light active" style="--gutter:64px;--title-size:96px;--title-weight:300;--title-gap:40px;--body-top:240px;--metric-size:104px" data-storyweave-slide data-slide-id="s08" data-slide-index="7" data-layout-id="closing-statement" data-composition="closing-statement" data-page-rhythm="anchor" data-theme-ref="systems/ink-blue-grid" data-content-revision="1708b64e44e41252474c745c3c583b322b1de6694f706704070da3a40998182a"><div class="statement-composition" data-storyweave-region="copy"><div class="statement-copy"><h1 class=" " data-storyweave-content="title"><span class="title-word" data-storyweave-word>从</span><span class="title-word" data-storyweave-word>一份</span><span class="title-word" data-storyweave-word>真实</span><span class="title-word" data-storyweave-word>内容</span><span class="title-word" data-storyweave-word>开始</span></h1><div class="statement-body"><p data-storyweave-content="body" ><span class="copy-word" data-storyweave-word>确认</span><span class="copy-word" data-storyweave-word>内容，</span><span class="copy-word" data-storyweave-word>选择</span><span class="copy-word" data-storyweave-word>版式，</span><span class="copy-word" data-storyweave-word>核对</span><span class="copy-word" data-storyweave-word>页</span><span class="copy-word" data-storyweave-word>面。</span></p><p data-storyweave-content="body" ><span class="copy-word" data-storyweave-word>让</span><span class="copy-word" data-storyweave-word>每一</span><span class="copy-word" data-storyweave-word>次</span><span class="copy-word" data-storyweave-word>改</span><span class="copy-word" data-storyweave-word>动</span><span class="copy-word" data-storyweave-word>都有</span><span class="copy-word" data-storyweave-word>可</span><span class="copy-word" data-storyweave-word>比较</span><span class="copy-word" data-storyweave-word>的</span><span class="copy-word" data-storyweave-word>结果。</span></p></div></div></div><span class="counter">08 / 08</span></section></main></div><script>(()=>{function drawConnections() {
  const slide = document.querySelector('[data-storyweave-slide].active');
  for (const svg of slide?.querySelectorAll('.relationship-connections') ?? []) {
    const bounds = svg.getBoundingClientRect();
    if (!bounds.width || !bounds.height) continue;
    // SVG meet alignment can letterbox a 1088-unit frame inside the page gutter; use its actual transform.
    const inverse = svg.getScreenCTM().inverse();
    const nodes = new Map([...svg.parentElement.querySelectorAll('[data-node-id]')].map((node) => [node.dataset.nodeId, node]));
    const local = (element) => {
      const rect = element.getBoundingClientRect();
      const first = new DOMPoint(rect.left, rect.top).matrixTransform(inverse);
      const last = new DOMPoint(rect.right, rect.bottom).matrixTransform(inverse);
      return { left: first.x, right: last.x, top: first.y, bottom: last.y, x: (first.x + last.x) / 2, y: (first.y + last.y) / 2 };
    };
    for (const edge of svg.querySelectorAll('[data-edge-from][data-edge-to]')) {
      const fromNode = nodes.get(edge.dataset.edgeFrom);
      const toNode = nodes.get(edge.dataset.edgeTo);
      if (!fromNode || !toNode) continue;
      const from = local(fromNode.querySelector('.step-anchor') ?? fromNode);
      const to = local(toNode.querySelector('.step-anchor') ?? toNode);
      const horizontal = svg.dataset.flow === 'rail' || svg.dataset.flow === 'across' || (svg.dataset.flow !== 'down' && Math.abs(to.x - from.x) >= Math.abs(to.y - from.y));
      const sign = horizontal ? Math.sign(to.x - from.x) || 1 : Math.sign(to.y - from.y) || 1;
      const x1 = horizontal ? (sign > 0 ? from.right + 8 : from.left - 8) : from.x;
      const x2 = horizontal ? (sign > 0 ? to.left - 10 : to.right + 10) : to.x;
      const y1 = horizontal ? from.y : sign > 0 ? from.bottom + 8 : from.top - 8;
      const y2 = horizontal ? to.y : sign > 0 ? to.top - 10 : to.bottom + 10;
      const path = edge.querySelector('path');
      path.setAttribute('d', horizontal ? `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}` : `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`);
      const label = edge.querySelector('text');
      if (label) { const mid = path.getPointAtLength(path.getTotalLength() / 2); label.setAttribute('x', mid.x); label.setAttribute('y', mid.y - 14); }
    }
  }
};const stage=document.querySelector('.stage');const fit=()=>{stage.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';drawConnections()};fit();addEventListener('resize',fit,{passive:true});document.fonts.ready.then(drawConnections);})();</script></body></html>
