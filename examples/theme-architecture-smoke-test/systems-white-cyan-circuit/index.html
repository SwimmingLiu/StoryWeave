<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Systems / White Cyan Circuit · 主题案例</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:system-ui,"Noto Sans SC",sans-serif}.deck{height:100vh;display:grid;place-items:center}.slide{display:none;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}.slide.active{display:block}.slide img{width:100%;height:100%;display:block;object-fit:contain}.slide span{position:absolute;right:18px;bottom:14px;padding:7px 10px;border-radius:999px;background:#000a;font-size:12px;letter-spacing:.04em}button{position:fixed;top:50%;z-index:5;width:44px;height:44px;border:1px solid #ffffff44;border-radius:50%;background:#0009;color:#fff;font-size:26px;cursor:pointer;transform:translateY(-50%)}#prev{left:14px}#next{right:14px}.back{position:fixed;z-index:6;top:14px;left:16px;color:#fff;background:#0009;border:1px solid #ffffff33;border-radius:999px;padding:8px 12px;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<a class="back" href="../comparison_gallery.html">返回对比页</a>
<main class="deck"><section class="slide active" data-index="0"><img src="slides/c01.png" alt="cover：AI 原生知识工作流"><span>01 / 04 · cover</span></section>
<section class="slide" data-index="1"><img src="slides/c02.png" alt="statement：信息很多，上下文却在丢失"><span>02 / 04 · statement</span></section>
<section class="slide" data-index="2"><img src="slides/c03.png" alt="process：四个动作构成闭环"><span>03 / 04 · process / headline-led</span></section>
<section class="slide" data-index="3"><img src="slides/c04.png" alt="process：四个动作构成闭环"><span>04 / 04 · process / visual-led</span></section></main>
<button id="prev" aria-label="上一页">‹</button><button id="next" aria-label="下一页">›</button>
<script>
const slides=[...document.querySelectorAll(".slide")];let current=0;
function show(next){slides[current].classList.remove("active");current=(next+slides.length)%slides.length;slides[current].classList.add("active")}
document.querySelector("#prev").onclick=()=>show(current-1);document.querySelector("#next").onclick=()=>show(current+1);
addEventListener("keydown",event=>{if(["ArrowRight","PageDown"," "].includes(event.key))show(current+1);if(["ArrowLeft","PageUp"].includes(event.key))show(current-1)});
</script>
</body>
</html>
