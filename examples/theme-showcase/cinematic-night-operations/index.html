<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜间值班：服务仍然继续</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0d1111;color:#fff;font-family:system-ui,'Noto Sans SC',sans-serif}.deck{height:100vh;display:grid;place-items:center}.slide{display:none;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}.slide.active{display:block}.slide img{width:100%;height:100%;display:block;object-fit:contain}.slide span{position:absolute;right:16px;bottom:10px;background:#000a;padding:5px 8px;font-size:12px;border-radius:3px}button{position:fixed;top:50%;width:42px;height:42px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:24px;cursor:pointer;transform:translateY(-50%)}#prev{left:12px}#next{right:12px}@media(max-width:700px){button{width:34px;height:34px;font-size:18px}}</style></head><body><main class="deck"><section class="slide active" data-slide="0"><img src="slides/s01.png" alt="夜间值班，服务仍然继续"><span>1 / 3</span></section><section class="slide" data-slide="1"><img src="slides/s02.png" alt="当系统交给人工，交接不能从零开始"><span>2 / 3</span></section><section class="slide" data-slide="2"><img src="slides/s03.png" alt="让下一班人接住已经发生的事"><span>3 / 3</span></section></main><button id="prev" title="上一页" aria-label="上一页">‹</button><button id="next" title="下一页" aria-label="下一页">›</button><script>const slides=[...document.querySelectorAll('.slide')];let current=0;function show(next){if(!slides.length)return;slides[current].classList.remove('active');current=(next+slides.length)%slides.length;slides[current].classList.add('active')}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1)});</script></body></html>
